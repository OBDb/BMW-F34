generations:
  - name: "3 Series Gran Turismo (F34)"
    start_year: 2013
    end_year: 2016
    description: "The BMW F34 3 Series Gran Turismo was a unique variant in the sixth-generation 3 Series lineup, featuring a fastback body style that combined elements of sedan, wagon, and crossover designs. Unveiled at the 83rd Geneva International Motor Show in March 2013, the F34 was based on the long-wheelbase version of the 3 Series platform and was 200mm longer than the standard sedan, with a 110mm longer wheelbase, offering significantly more rear legroom and cargo space. The raised seating position provided better visibility and easier entry/exit. At launch, the engine range consisted of turbocharged petrol and diesel engines in straight-4 and straight-6 configurations, with all-wheel drive available in the xDrive models. All F34 models came standard with an eight-speed automatic transmission. Distinctive styling elements included an actively deploying rear spoiler, frameless windows, and a unique tailgate design."
  - name: "3 Series Gran Turismo (F34) - 2016 Facelift"
    start_year: 2016
    end_year: 2020
    description: "The F34 received a facelift (Life Cycle Impulse) in mid-2016, introducing updated styling, technology features, and an updated engine lineup. The 340i models now used the B58 engine, replacing the previous N55 engine in the 335i. Despite offering practical advantages over the standard 3 Series models, the Gran Turismo remained a niche product in BMW's lineup, appealing to buyers seeking extra space without moving to an SUV or traditional wagon. Production continued until early 2020, with no direct replacement, as BMW streamlined its model range and eventually replaced the segment with the 4 Series Gran Coupé."
